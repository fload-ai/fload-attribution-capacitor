name: Publish to npm

# Manual only. It defaults to a dry run: build, test, pack and `npm publish --dry-run`.
# A real publish needs dry_run unticked. It signs in by npm trusted publishing
# (OIDC), with no npm token: the package's trusted publisher on npmjs.com
# names this repository and publish.yml.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (build, test and pack; publish nothing)
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) and provenance

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing's OIDC exchange needs npm CLI 11.5.1 or newer.
      - name: npm 11.21.1
        run: |
          npm install -g npm@11.21.1
          test "$(npm --version)" = 11.21.1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: The tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF_NAME}" = "$(node -p "require('./package.json').version")"

      - run: npm ci --no-audit --no-fund
      - run: npm run build

      - name: Vendored Swift SDK matches its tag
        run: npm run check:vendor

      - name: iOS argument checks (host Swift)
        run: npm run test:ios-host

      - name: Android unit tests
        run: npm run test:android

      - name: Package contents
        run: npm pack --dry-run

      - name: Publish
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          PRIVATE_REPO: ${{ github.event.repository.private }}
        shell: bash
        run: |
          flags=(--access public)
          # npm provenance works only from a public repository.
          if [ "$PRIVATE_REPO" = "false" ]; then flags+=(--provenance); fi
          if [ "$DRY_RUN" = "true" ]; then
            npm publish "${flags[@]}" --dry-run
          else
            npm publish "${flags[@]}"
          fi
