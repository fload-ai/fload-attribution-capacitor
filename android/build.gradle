ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    // The Kotlin SDK this plugin wraps. An app can pin another 1.x by setting
    // `floadAttributionAndroidVersion` in its variables.gradle.
    floadAttributionAndroidVersion = rootProject.ext.has('floadAttributionAndroidVersion') ? rootProject.ext.floadAttributionAndroidVersion : '1.0.2'
}

buildscript {
    ext.kotlin_version = project.hasProperty("kotlin_version") ? rootProject.ext.kotlin_version : '2.2.20'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace = "com.fload.attribution.capacitor"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
        versionCode 1
        versionName "1.0"
    }
    lintOptions {
        abortOnError = false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

kotlin {
    jvmToolchain(21)
}

// fload-attribution-android is built by JitPack from its git tags. Only that
// group is read from JitPack; everything else still comes from Google and Maven Central.
def floadJitPack = { handler ->
    handler.maven {
        url 'https://jitpack.io'
        content { includeGroup 'com.github.fload-ai' }
    }
}

repositories {
    google()
    mavenCentral()
    floadJitPack(delegate)
}

// The app module resolves this plugin's dependencies with its own repositories,
// so JitPack has to be there too. Apps whose settings.gradle forbids project
// repositories add the same `maven { url 'https://jitpack.io' }` line themselves (README).
rootProject.allprojects { project ->
    project.repositories { floadJitPack(delegate) }
}

dependencies {
    implementation project(':capacitor-android')
    implementation "com.github.fload-ai:fload-attribution-android:$floadAttributionAndroidVersion"
    testImplementation "junit:junit:$junitVersion"
}
